<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="asphalt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3a3a4a"/>
      <stop offset="100%" style="stop-color:#2a2a38"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa"/>
      <stop offset="100%" style="stop-color:#00a878"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f5a623"/>
      <stop offset="100%" style="stop-color:#f7c948"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="16" cy="16" r="15.5" fill="url(#roadGrad)" stroke="#0d1b2a" stroke-width="0.5"/>

  <!-- Road surface (perspective trapezoid) -->
  <polygon points="9,26 23,26 20,10 12,10" fill="url(#asphalt)"/>

  <!-- Road edge lines -->
  <line x1="9" y1="26" x2="12" y2="10" stroke="#555566" stroke-width="0.8"/>
  <line x1="23" y1="26" x2="20" y2="10" stroke="#555566" stroke-width="0.8"/>

  <!-- Dashed center lane markings -->
  <line x1="16" y1="24" x2="16" y2="21" stroke="url(#accentGrad)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="16" y1="19" x2="16" y2="16" stroke="url(#accentGrad)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="16" y1="14" x2="16" y2="11.5" stroke="url(#accentGrad)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Geometry angle indicator (top-left arc) -->
  <path d="M 10,10 A 5,5 0 0,1 14,7" stroke="#7b8cde" stroke-width="1" fill="none" stroke-linecap="round"/>
  <line x1="10" y1="10" x2="14" y2="10" stroke="#7b8cde" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="10" y1="10" x2="12.8" y2="7.2" stroke="#7b8cde" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Checkmark badge (bottom-right) -->
  <circle cx="23" cy="23" r="5" fill="#0d1b2a" stroke="url(#checkGrad)" stroke-width="1"/>
  <polyline points="20.5,23 22.2,24.8 25.5,21.2" stroke="url(#checkGrad)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
